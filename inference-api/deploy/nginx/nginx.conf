worker_processes auto;

events {
    worker_connections 4096;
}

http {
    log_format json escape=json
        '{"timestamp":"$time_iso8601","request_id":"$req_id","method":"$request_method",'
        '"path":"$uri","status":$status,"upstream":"$upstream_addr",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Propaga el X-Request-ID del cliente o genera uno: trazabilidad LB → réplica → logs.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream api {
        # Docker resuelve `api` a las IPs de todas las réplicas al arrancar nginx.
        # least_conn: los streams SSE son largos; round-robin desbalancearía conexiones.
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
        keepalive_timeout 60s;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Dentro de la red interna conectar tarda < 1 ms: si en 500 ms no conectó, la réplica murió.
    proxy_connect_timeout 500ms;
    proxy_read_timeout 150s;

    server {
        listen 80;
        client_max_body_size 1m;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # SSE: sin buffering para que cada token llegue al cliente apenas se genera.
        location = /v1/infer/stream {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://api;
            # Se reintenta en otra réplica si la elegida murió (error/timeout de conexión: el request
            # nunca llegó) o hizo load shedding (503 antes de procesar). El timeout de lectura (150 s)
            # nunca se alcanza en la práctica porque la app corta antes (máx. 120 s), así que
            # `timeout` acá equivale a "no pude conectar".
            proxy_next_upstream error timeout http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }
    }
}
