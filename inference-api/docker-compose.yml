# `docker compose up` levanta el sistema completo sin configuración adicional:
#   nginx (LB, :8080) → api ×3 réplicas stateless → redis
# Perfil opcional: `docker compose --profile observability up` agrega Prometheus (:9090).
name: inference-api

x-api-env: &api-env
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  ENVIRONMENT: docker
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  API_KEYS: ${API_KEYS:-demo-client:demo-key-123,acme:acme-key-456}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}

services:
  redis:
    image: redis:7.4-alpine
    # Estado efímero (cache, cuotas, breaker): sin persistencia en disco. Todas las claves tienen
    # TTL, así que volatile-lru sólo desaloja datos que igual iban a expirar.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: inference-api:latest
    environment: *api-env
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    stop_grace_period: 35s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
